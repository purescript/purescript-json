package:
  name: json
  description: Standard types and basic operations for working with JSON.
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 1.1.1
    license: MIT
    location:
      githubOwner: purescript
      githubRepo: purescript-json
  dependencies:
    - arrays: ">=7.0.0 <8.0.0"
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - gen: ">=4.0.0 <5.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nonempty: ">=7.0.0 <8.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
workspace: {}
